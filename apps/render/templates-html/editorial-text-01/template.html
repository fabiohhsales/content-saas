<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body { width: 1080px; height: 1350px; margin: 0; overflow: hidden; background: var(--bg-light, #F8F5F0); color: var(--text-on-light, #1B2A4A); font-family: var(--font-body, Arial), Helvetica, sans-serif; }
    .post { width: 1080px; height: 1350px; padding: var(--space-xxl, 92px) var(--space-xxl, 92px) var(--space-xl, 86px); display: flex; flex-direction: column; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; min-height: 56px; }
    .brand { color: var(--text-on-light, #1B2A4A); opacity: .55; font-size: 22px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
    .logo { max-width: 160px; max-height: 56px; object-fit: contain; display: none; }
    .kicker { margin-top: var(--space-xl, 56px); color: var(--accent, #C9A96E); font-size: 22px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
    .kicker[data-empty="true"] { display: none; }
    h1 { margin: var(--space-md, 18px) 0 0; font-family: var(--font-heading, Georgia), 'Times New Roman', serif; font-size: 62px; line-height: 1.06; max-width: 880px; font-weight: 700; }
    .divider { width: 76px; height: var(--divider-width, 2px); margin: var(--space-md, 18px) 0 0; background: var(--divider-color, #C9A96E); }
    .divider[data-empty="true"] { display: none; }
    .body { margin-top: var(--space-lg, 32px); font-size: 28px; line-height: 1.4; max-width: 880px; color: rgba(27,42,74,.78); }
    .body[data-empty="true"] { display: none; }
    .bullets { margin-top: 38px; display: flex; flex-direction: column; gap: 18px; }
    .bullet { display: grid; grid-template-columns: 54px 1fr; gap: 18px; align-items: flex-start; }
    .bullet[data-empty="true"] { display: none; }
    .bullet-mark { width: 40px; height: 40px; border-radius: 50%; background: var(--accent, #C9A96E); color: var(--text-on-light, #1B2A4A); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; flex-shrink: 0; margin-top: 2px; }
    .bullet-text { font-size: 26px; line-height: 1.32; color: var(--text-on-light, #1B2A4A); font-weight: 600; }
    .cta { margin-top: auto; padding-top: 28px; border-top: 4px solid var(--accent, #C9A96E); font-size: 26px; font-weight: 800; color: var(--text-on-light, #1B2A4A); text-transform: uppercase; letter-spacing: 1.2px; }
    .cta[data-empty="true"] { display: none; }
  </style>
</head>
<body>
  <main class="post">
    <div class="top"><div id="brand_name" class="brand"></div><img id="logo" class="logo" /></div>
    <div id="kicker" class="kicker"></div>
    <div id="divider" class="divider"></div>
    <h1 id="headline"></h1>
    <p id="body" class="body"></p>
    <div class="bullets">
      <div id="b1" class="bullet"><div class="bullet-mark">1</div><div id="t1" class="bullet-text"></div></div>
      <div id="b2" class="bullet"><div class="bullet-mark">2</div><div id="t2" class="bullet-text"></div></div>
      <div id="b3" class="bullet"><div class="bullet-mark">3</div><div id="t3" class="bullet-text"></div></div>
    </div>
    <div id="cta" class="cta"></div>
  </main>
  <script>
    document.addEventListener('renderdata', function () {
      var d = window.__DATA__ || {};
      var f = d.fields || {};
      var a = d.assets || {};
      var deco = d.decorators || {};
      document.getElementById('brand_name').textContent = f.brand_name || '';
      var kicker = document.getElementById('kicker');
      if (f.kicker) kicker.textContent = f.kicker; else kicker.setAttribute('data-empty', 'true');
      var divider = document.getElementById('divider');
      if (deco.divider_type === 'none' || !deco.divider_type) divider.setAttribute('data-empty', 'true');
      else if (deco.divider_type === 'subtle') divider.style.opacity = '0.3';
      else if (deco.divider_type === 'solid') divider.style.height = '2px';
      document.getElementById('headline').textContent = f.headline || '';
      var body = document.getElementById('body');
      if (f.body) body.textContent = f.body; else body.setAttribute('data-empty', 'true');
      var bullets = [
        { row: 'b1', text: 't1', value: f.bullet_1 },
        { row: 'b2', text: 't2', value: f.bullet_2 },
        { row: 'b3', text: 't3', value: f.bullet_3 },
      ];
      bullets.forEach(function (b) {
        if (b.value) document.getElementById(b.text).textContent = b.value;
        else document.getElementById(b.row).setAttribute('data-empty', 'true');
      });
      var cta = document.getElementById('cta');
      if (f.cta) cta.textContent = f.cta; else cta.setAttribute('data-empty', 'true');
      if (a.logo) { var logo = document.getElementById('logo'); logo.src = 'data:image/png;base64,' + a.logo; logo.style.display = 'block'; }
    });
  </script>
</body>
</html>
