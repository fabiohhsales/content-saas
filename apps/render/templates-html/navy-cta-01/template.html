<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      position: relative;
      background: var(--bg-dark, #172b42);
      color: var(--text-on-dark, #fff);
      font-family: var(--font-body, Montserrat), Arial, sans-serif;
    }

    /* ── Watermark logo shape (decorative half-circle right side) ── */
    .watermark {
      position: absolute;
      right: -200px;
      top: 50%;
      transform: translateY(-50%);
      width: 680px;
      height: 680px;
      border-radius: 50%;
      border: 32px solid rgba(255, 255, 255, 0.04);
      pointer-events: none;
    }

    /* ── Content ── */
    .content {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      left: 110px;
      right: 110px;
      z-index: 10;
      text-align: center;
    }

    .headline {
      font-family: var(--font-heading, 'Cormorant Garamond'), Georgia, serif;
      font-size: 72px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--text-on-dark, #fff);
      margin-bottom: 60px;
    }

    /* ── Highlight box ── */
    .highlight-box {
      background: var(--bg-light, #f7f0e6);
      color: var(--text-on-light, #172b42);
      padding: 44px 64px;
      display: inline-block;
      width: 100%;
    }
    .highlight-box p {
      font-family: var(--font-heading, 'Cormorant Garamond'), Georgia, serif;
      font-size: 44px;
      font-weight: 700;
      line-height: 1.2;
    }
    .highlight-box[data-empty="true"] { display: none; }

    /* ── Body (alternative to highlight box) ── */
    .body {
      font-size: 32px;
      font-weight: 400;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 48px;
    }
    .body[data-empty="true"] { display: none; }

    /* ── Logo bottom center ── */
    .logo-wrap {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      text-align: center;
    }
    .logo-wrap img {
      max-width: 180px;
      max-height: 64px;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }
    .logo-placeholder {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.55);
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="watermark"></div>

  <div class="content">
    <h1 class="headline" id="headline"></h1>
    <div class="highlight-box" id="highlight-box">
      <p id="highlight-text"></p>
    </div>
    <p class="body" id="body"></p>
  </div>

  <div class="logo-wrap" id="logo-wrap">
    <span class="logo-placeholder" id="logo-placeholder"></span>
    <img id="logo-img" src="" alt="" style="display:none" />
  </div>

  <script>
    document.addEventListener('renderdata', function () {
      var d = (window.__DATA__ || {});
      var f = d.fields || {};
      var a = d.assets || {};

      // Headline
      if (f.headline) document.getElementById('headline').textContent = f.headline;

      // Highlight box
      if (f.highlight_box) {
        document.getElementById('highlight-text').textContent = f.highlight_box;
        document.getElementById('body').setAttribute('data-empty', 'true');
      } else if (f.body) {
        document.getElementById('highlight-box').setAttribute('data-empty', 'true');
        document.getElementById('body').textContent = f.body;
      } else {
        document.getElementById('highlight-box').setAttribute('data-empty', 'true');
        document.getElementById('body').setAttribute('data-empty', 'true');
      }

      // Logo
      if (a.logo) {
        document.getElementById('logo-img').src = 'data:image/png;base64,' + a.logo;
        document.getElementById('logo-img').style.display = 'block';
        document.getElementById('logo-placeholder').style.display = 'none';
      } else if (f.brand_name) {
        document.getElementById('logo-placeholder').textContent = f.brand_name;
      } else {
        document.getElementById('logo-wrap').style.display = 'none';
      }
    });
  </script>
</body>
</html>
