<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    figure { margin: 0; }
    body {
      width: 1080px;
      height: 1350px;
      margin: 0;
      overflow: hidden;
      background: var(--bg-dark, #172334);
      color: var(--text-on-dark, #fffaf2);
      font-family: var(--font-body, Arial), Helvetica, sans-serif;
    }
    .post { position: relative; width: 1080px; height: 1350px; display: grid; grid-template-rows: 55% 45%; }
    .navy { position: relative; padding: 96px 88px 72px; background: var(--bg-dark, #172334); overflow: hidden; display: grid; grid-template-columns: 1.04fr .96fr; gap: 48px; align-items: end; }
    .navy::after { content: ""; position: absolute; right: -220px; top: -120px; width: 560px; height: 560px; border: 2px solid rgba(203, 177, 132, .28); border-radius: 50%; }
    .copy { position: relative; z-index: 2; }
    .brand { color: var(--accent, #cbb184); font-size: 22px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 72px; }
    h1 { position: relative; z-index: 1; margin: 0; max-width: 770px; font-family: var(--font-heading, Georgia), 'Times New Roman', serif; font-size: 78px; line-height: 1.02; font-weight: 700; letter-spacing: 0; }
    h1 span { color: var(--accent, #cbb184); font-style: italic; }
    .photo-panel { position: relative; z-index: 1; height: 560px; border: 1px solid rgba(203,177,132,.42); overflow: hidden; background: rgba(255,255,255,.035); display: none; }
    .photo-panel img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.92) contrast(1.04); }
    .photo-panel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(23,35,52,.05), rgba(23,35,52,.42)); }
    .paper { position: relative; padding: 86px 88px; background: var(--bg-light, #f7f0e5); color: var(--text-on-light, #172334); display: flex; flex-direction: column; gap: 34px; }
    .data { border-left: 8px solid var(--accent, #cbb184); padding: 16px 0 16px 34px; font-size: 42px; line-height: 1.18; font-weight: 700; }
    .data[data-empty="true"] { display: none; }
    .cta { margin-top: auto; color: var(--accent, #8a6f42); font-size: 28px; line-height: 1.3; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    .logo { position: absolute; right: 82px; bottom: 78px; max-width: 170px; max-height: 64px; object-fit: contain; display: none; }
  </style>
</head>
<body>
  <main class="post">
    <section class="navy">
      <div class="copy">
        <div id="brand_name" class="brand"></div>
        <h1 id="headline"></h1>
      </div>
      <figure id="photo-panel" class="photo-panel"><img id="photo" /></figure>
    </section>
    <section class="paper">
      <div id="dado1" class="data"></div>
      <div id="dado2" class="data"></div>
      <div id="cta" class="cta"></div>
      <img id="logo" class="logo" />
    </section>
  </main>
  <script>
    document.addEventListener('renderdata', function () {
      var d = window.__DATA__ || {};
      var f = d.fields || {};
      var a = d.assets || {};
      document.getElementById('brand_name').textContent = f.brand_name || '';
      var headline = f.headline || '';
      var headlineEl = document.getElementById('headline');
      if (f.destaque && headline.indexOf(f.destaque) >= 0) {
        headlineEl.textContent = '';
        var before = headline.slice(0, headline.indexOf(f.destaque));
        var after = headline.slice(headline.indexOf(f.destaque) + f.destaque.length);
        headlineEl.appendChild(document.createTextNode(before));
        var span = document.createElement('span');
        span.textContent = f.destaque;
        headlineEl.appendChild(span);
        headlineEl.appendChild(document.createTextNode(after));
      } else {
        headlineEl.textContent = headline;
      }
      document.getElementById('dado1').textContent = f.dado_1 || '';
      var dado2 = document.getElementById('dado2');
      if (f.dado_2) dado2.textContent = f.dado_2;
      else dado2.setAttribute('data-empty', 'true');
      document.getElementById('cta').textContent = f.cta || '';
      if (a.logo) {
        var logo = document.getElementById('logo');
        logo.src = 'data:image/png;base64,' + a.logo;
        logo.style.display = 'block';
      }
      if (a.photo) {
        var photoPanel = document.getElementById('photo-panel');
        var photo = document.getElementById('photo');
        photo.src = 'data:image/jpeg;base64,' + a.photo;
        photoPanel.style.display = 'block';
      }
    });
  </script>
</body>
</html>
