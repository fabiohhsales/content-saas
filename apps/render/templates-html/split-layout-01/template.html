<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body { width: 1080px; height: 1350px; margin: 0; overflow: hidden; background: var(--bg-dark, #1B2A4A); color: var(--text-on-dark, #F8F5F0); font-family: var(--font-body, Arial), Helvetica, sans-serif; }
    .post { width: 1080px; height: 1350px; display: grid; grid-template-rows: 1fr 1fr 110px; }
    .side { position: relative; padding: 84px 76px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
    .side-dark { background: var(--bg-dark, #1B2A4A); color: var(--text-on-dark, #F8F5F0); }
    .side-dark .photo-bg { position: absolute; inset: 0; opacity: .35; }
    .side-dark .photo-bg img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .side-dark .scrim { position: absolute; inset: 0; background: linear-gradient(125deg, rgba(27,42,74,.78), rgba(27,42,74,.96)); }
    .side-light { background: var(--bg-light, #F8F5F0); color: var(--text-on-light, #1B2A4A); }
    .top { display: flex; justify-content: space-between; align-items: flex-start; min-height: 56px; position: relative; z-index: 1; }
    .brand { font-size: 22px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
    .side-dark .brand { color: var(--accent, #C9A96E); }
    .side-light .brand { color: var(--text-on-light, #1B2A4A); opacity: .55; }
    .logo { max-width: 140px; max-height: 48px; object-fit: contain; display: none; }
    .side-dark .logo { filter: brightness(0) invert(1); }
    h2 { margin: 0 0 16px; font-family: var(--font-heading, Georgia), 'Times New Roman', serif; font-size: 54px; line-height: 1.08; font-weight: 700; max-width: 460px; position: relative; z-index: 1; }
    .sub { font-size: 24px; line-height: 1.36; max-width: 460px; position: relative; z-index: 1; }
    .side-dark .sub { color: rgba(248,245,240,.78); }
    .side-light .sub { color: rgba(27,42,74,.72); }
    .sub[data-empty="true"] { display: none; }
    .badge { display: inline-block; font-size: 18px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; padding: 6px 14px; border: 1px solid currentColor; position: relative; z-index: 1; align-self: flex-start; }
    .side-dark .badge { color: var(--accent, #C9A96E); border-color: var(--accent, #C9A96E); }
    .side-light .badge { color: var(--text-on-light, #1B2A4A); border-color: var(--text-on-light, #1B2A4A); }
    .cta { background: var(--accent, #C9A96E); color: var(--text-on-light, #1B2A4A); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
    .cta[data-empty="true"] { background: var(--bg-dark, #1B2A4A); color: var(--accent, #C9A96E); border-top: 1px solid rgba(201,169,110,.35); font-size: 22px; }
  </style>
</head>
<body>
  <main class="post">
    <section class="side side-dark">
      <div class="photo-bg"><img id="photo" /></div>
      <div class="scrim"></div>
      <div class="top"><div id="brand_name" class="brand"></div><img id="logo" class="logo" /></div>
      <div>
        <div class="badge">A</div>
        <h2 id="side1_headline" style="margin-top:18px"></h2>
        <p id="side1_sub" class="sub"></p>
      </div>
    </section>
    <section class="side side-light">
      <div class="top"><div class="brand" style="visibility:hidden">.</div></div>
      <div>
        <div class="badge">B</div>
        <h2 id="side2_headline" style="margin-top:18px"></h2>
        <p id="side2_sub" class="sub"></p>
      </div>
    </section>
    <div id="cta" class="cta"></div>
  </main>
  <script>
    document.addEventListener('renderdata', function () {
      var d = window.__DATA__ || {};
      var f = d.fields || {};
      var a = d.assets || {};
      document.getElementById('brand_name').textContent = f.brand_name || '';
      document.getElementById('side1_headline').textContent = f.side1_headline || '';
      var s1sub = document.getElementById('side1_sub');
      if (f.side1_sub) s1sub.textContent = f.side1_sub; else s1sub.setAttribute('data-empty', 'true');
      document.getElementById('side2_headline').textContent = f.side2_headline || '';
      var s2sub = document.getElementById('side2_sub');
      if (f.side2_sub) s2sub.textContent = f.side2_sub; else s2sub.setAttribute('data-empty', 'true');
      var cta = document.getElementById('cta');
      if (f.cta) cta.textContent = f.cta; else { cta.textContent = ''; cta.setAttribute('data-empty', 'true'); }
      if (a.logo) { var logo = document.getElementById('logo'); logo.src = 'data:image/png;base64,' + a.logo; logo.style.display = 'block'; }
      if (a.photo) { var photo = document.getElementById('photo'); photo.src = 'data:image/jpeg;base64,' + a.photo; photo.style.display = 'block'; }
    });
  </script>
</body>
</html>
