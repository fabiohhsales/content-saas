<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    figure { margin: 0; }
    body { width: 1080px; height: 1350px; margin: 0; overflow: hidden; background: var(--bg-dark, #172334); color: var(--text-on-dark, #fffaf2); font-family: var(--font-body, Arial), Helvetica, sans-serif; }
    .post { width: 1080px; height: 1350px; padding: 88px 86px 80px; display: flex; flex-direction: column; }
    header { display: flex; justify-content: space-between; align-items: flex-start; min-height: 82px; }
    .brand { color: var(--accent, #cbb184); font-size: 22px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
    .logo { max-width: 170px; max-height: 64px; object-fit: contain; display: none; filter: brightness(0) invert(1); }
    .hero { margin: 70px 0 58px; display: grid; grid-template-columns: 1.02fr .98fr; gap: 44px; align-items: end; }
    h1 { margin: 0; max-width: 850px; font-family: var(--font-heading, Georgia), 'Times New Roman', serif; font-size: 72px; line-height: 1.02; letter-spacing: 0; }
    .photo-band { height: 360px; border: 1px solid rgba(203,177,132,.42); overflow: hidden; background: rgba(255,255,255,.035); display: none; }
    .photo-band img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.9) contrast(1.04); }
    .timeline { position: relative; display: flex; flex-direction: column; gap: 36px; }
    .timeline::before { content: ""; position: absolute; left: 30px; top: 24px; bottom: 24px; width: 4px; background: rgba(203,177,132,.45); }
    .step { position: relative; display: grid; grid-template-columns: 90px 1fr; gap: 26px; align-items: flex-start; }
    .step[data-empty="true"] { display: none; }
    .dot { position: relative; z-index: 1; width: 64px; height: 64px; border-radius: 50%; background: var(--accent, #cbb184); color: var(--text-on-light, #172334); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; }
    .label { color: var(--accent, #cbb184); font-size: 27px; line-height: 1.2; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    .text { margin-top: 10px; font-size: 33px; line-height: 1.28; color: rgba(255,250,242,.86); }
    .fechamento { margin-top: auto; padding-top: 42px; border-top: 4px solid var(--accent, #cbb184); font-size: 34px; line-height: 1.3; font-weight: 800; color: var(--accent, #cbb184); }
  </style>
</head>
<body>
  <main class="post">
    <header><div id="brand_name" class="brand"></div><img id="logo" class="logo" /></header>
    <section class="hero">
      <h1 id="titulo"></h1>
      <figure id="photo-band" class="photo-band"><img id="photo" /></figure>
    </section>
    <section class="timeline">
      <article id="s1" class="step"><div class="dot">1</div><div><div id="l1" class="label"></div><div id="t1" class="text"></div></div></article>
      <article id="s2" class="step"><div class="dot">2</div><div><div id="l2" class="label"></div><div id="t2" class="text"></div></div></article>
      <article id="s3" class="step"><div class="dot">3</div><div><div id="l3" class="label"></div><div id="t3" class="text"></div></div></article>
    </section>
    <div id="fechamento" class="fechamento"></div>
  </main>
  <script>
    document.addEventListener('renderdata', function () {
      var d = window.__DATA__ || {};
      var f = d.fields || {};
      var a = d.assets || {};
      document.getElementById('brand_name').textContent = f.brand_name || '';
      document.getElementById('titulo').textContent = f.titulo || '';
      document.getElementById('l1').textContent = f.etapa_1_label || '';
      document.getElementById('t1').textContent = f.etapa_1_texto || '';
      if (f.etapa_2_label || f.etapa_2_texto) {
        document.getElementById('l2').textContent = f.etapa_2_label || '';
        document.getElementById('t2').textContent = f.etapa_2_texto || '';
      } else document.getElementById('s2').setAttribute('data-empty', 'true');
      if (f.etapa_3_label || f.etapa_3_texto) {
        document.getElementById('l3').textContent = f.etapa_3_label || '';
        document.getElementById('t3').textContent = f.etapa_3_texto || '';
      } else document.getElementById('s3').setAttribute('data-empty', 'true');
      document.getElementById('fechamento').textContent = f.fechamento || '';
      if (a.logo) { var logo = document.getElementById('logo'); logo.src = 'data:image/png;base64,' + a.logo; logo.style.display = 'block'; }
      if (a.photo) {
        var photoBand = document.getElementById('photo-band');
        var photo = document.getElementById('photo');
        photo.src = 'data:image/jpeg;base64,' + a.photo;
        photoBand.style.display = 'block';
      }
    });
  </script>
</body>
</html>
