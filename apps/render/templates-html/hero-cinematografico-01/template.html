<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hero Cinematográfico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Slab:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: var(--bg-dark, #222d41);
        --paper: var(--bg-light, #fcf8ed);
        --gold: var(--accent, #c8b08a);
        --slate: var(--text-on-light, #5b677a);
        --white: var(--text-on-dark, #fffdf8);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        font-family: var(--font-body, Poppins), Arial, sans-serif;
      }

      .post {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: var(--bg-dark, #0e1520);
        color: var(--white);
      }

      .post .photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 42%;
      }

      .post::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(to bottom,
            rgba(10, 16, 26, 0.54) 0%,
            rgba(10, 16, 26, 0.08) 35%,
            rgba(10, 16, 26, 0.90) 68%
          ),
          linear-gradient(to right,
            rgba(10, 16, 26, 0.38),
            rgba(10, 16, 26, 0)
          );
      }

      .post .logo {
        position: absolute;
        z-index: 2;
        left: 64px;
        top: 68px;
        width: 210px;
        filter: brightness(0) invert(1);
        opacity: 0.92;
        display: none;
      }

      .post .seal {
        position: absolute;
        z-index: 2;
        right: 64px;
        top: 60px;
        width: 122px;
        mix-blend-mode: screen;
        display: none;
      }

      .post .copy {
        position: absolute;
        z-index: 2;
        left: 72px;
        right: 72px;
        bottom: 112px;
      }

      .kicker {
        margin: 0;
        color: var(--gold);
        font-size: 21px;
        font-weight: 500;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }

      .rule {
        width: 72px;
        height: 2px;
        background: var(--gold);
        margin: 16px 0;
      }

      .post .copy h1 {
        margin: 0;
        font-family: var(--font-heading, "Josefin Slab"), Georgia, serif;
        font-size: 62px;
        line-height: 1.04;
        color: var(--white);
        font-weight: 400;
      }

      .emphasis {
        font-family: var(--font-heading, "Josefin Slab"), Georgia, serif;
        font-weight: 400;
        font-style: italic;
        color: var(--gold);
      }

      .post .copy p.sub {
        margin: 36px 0 0;
        font-size: 26px;
        line-height: 1.42;
        color: rgba(255, 253, 248, 0.78);
        max-width: 820px;
      }
    </style>
  </head>
  <body>
    <article class="post">
      <img id="photo" class="photo" alt="" />
      <img id="logo" class="logo" alt="" />
      <img id="seal" class="seal" alt="" />
      <section class="copy">
        <p id="kicker" class="kicker"></p>
        <div class="rule"></div>
        <h1 id="headline"></h1>
        <p id="sub" class="sub"></p>
      </section>
    </article>
    <script>
      document.addEventListener('renderdata', function () {
        var d = window.__DATA__ || {};
        var f = d.fields || {};
        var a = d.assets || {};

        // Kicker (label uppercase gold)
        var kickerEl = document.getElementById('kicker');
        if (f.kicker) {
          kickerEl.textContent = f.kicker;
        } else {
          kickerEl.style.display = 'none';
          // remove the rule below it if no kicker
          var rule = document.querySelector('.rule');
          if (rule) rule.style.marginTop = '0';
        }

        // Headline: substitui f.destaque por <span class="emphasis">…</span>
        var headlineEl = document.getElementById('headline');
        var headline = f.headline || '';
        // Permite quebra de linha explícita com "\n" ou "<br>"
        headline = headline.replace(/\\n/g, '<br />').replace(/\n/g, '<br />');
        if (f.destaque && headline.indexOf(f.destaque) >= 0) {
          headline = headline.replace(
            f.destaque,
            '<span class="emphasis">' + f.destaque + '</span>'
          );
        }
        headlineEl.innerHTML = headline;

        // Sub
        var subEl = document.getElementById('sub');
        if (f.sub) {
          subEl.textContent = f.sub;
        } else {
          subEl.style.display = 'none';
        }

        // Assets: logo + seal + photo
        function detectMime(b64) {
          // PNG signature when base64-decoded starts with iVBORw0KGgo
          if (b64.indexOf('iVBORw0KGgo') === 0) return 'image/png';
          return 'image/jpeg';
        }

        if (a.logo) {
          var logoEl = document.getElementById('logo');
          logoEl.src = 'data:' + detectMime(a.logo) + ';base64,' + a.logo;
          logoEl.style.display = 'block';
        }
        if (a.seal) {
          var sealEl = document.getElementById('seal');
          sealEl.src = 'data:' + detectMime(a.seal) + ';base64,' + a.seal;
          sealEl.style.display = 'block';
        }
        if (a.photo) {
          var photoEl = document.getElementById('photo');
          photoEl.src = 'data:' + detectMime(a.photo) + ';base64,' + a.photo;
        }
      });
    </script>
  </body>
</html>
