<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body { width: 1080px; height: 1350px; margin: 0; overflow: hidden; background: var(--bg-dark, #1B2A4A); color: var(--text-on-dark, #F8F5F0); font-family: var(--font-body, Arial), Helvetica, sans-serif; }
    .post { width: 1080px; height: 1350px; display: grid; grid-template-rows: 65% 35%; }
    .photo-band { position: relative; background: var(--bg-dark, #0E1A33); overflow: hidden; }
    .photo-band img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .photo-band .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(201,169,110,.25); font-family: Georgia, serif; font-size: 240px; }
    .panel { position: relative; padding: var(--space-xl, 64px) var(--space-xxl, 84px) var(--space-xl, 72px); display: flex; flex-direction: column; justify-content: space-between; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; min-height: 56px; }
    .brand { color: var(--accent, #C9A96E); font-size: 22px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
    .logo { max-width: 160px; max-height: 56px; object-fit: contain; display: none; filter: brightness(0) invert(1); }
    h1 { margin: 18px 0 0; font-family: var(--font-heading, Georgia), 'Times New Roman', serif; font-size: 64px; line-height: 1.06; font-weight: 700; max-width: 880px; }
    .sub { margin-top: var(--space-md, 22px); color: rgba(248,245,240,.78); font-size: 28px; line-height: 1.32; max-width: 820px; }
    .rule { width: 220px; height: 4px; background: var(--accent, #C9A96E); margin-top: var(--space-lg, 28px); }
  </style>
</head>
<body>
  <main class="post">
    <div class="photo-band">
      <div class="placeholder">H</div>
      <img id="photo" />
    </div>
    <section class="panel">
      <div class="top"><div id="brand_name" class="brand"></div><img id="logo" class="logo" /></div>
      <div>
        <h1 id="headline"></h1>
        <p id="subheadline" class="sub"></p>
        <div class="rule"></div>
      </div>
    </section>
  </main>
  <script>
    document.addEventListener('renderdata', function () {
      var d = window.__DATA__ || {};
      var f = d.fields || {};
      var a = d.assets || {};
      document.getElementById('brand_name').textContent = f.brand_name || '';
      document.getElementById('headline').textContent = f.headline || '';
      var sub = document.getElementById('subheadline');
      if (f.subheadline) sub.textContent = f.subheadline; else sub.style.display = 'none';
      if (a.logo) { var logo = document.getElementById('logo'); logo.src = 'data:image/png;base64,' + a.logo; logo.style.display = 'block'; }
      if (a.photo) {
        var photo = document.getElementById('photo');
        photo.src = 'data:image/jpeg;base64,' + a.photo;
        photo.style.display = 'block';
        document.querySelector('.photo-band .placeholder').style.display = 'none';
      }
    });
  </script>
</body>
</html>
