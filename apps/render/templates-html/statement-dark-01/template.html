<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body { width: 1080px; height: 1350px; margin: 0; overflow: hidden; background: var(--bg-dark, #1B2A4A); color: var(--text-on-dark, #F8F5F0); font-family: var(--font-body, Arial), Helvetica, sans-serif; }
    .post { width: 1080px; height: 1350px; padding: var(--space-xxl, 100px) var(--space-xxl, 92px) var(--space-xl, 88px); display: flex; flex-direction: column; position: relative; overflow: hidden; }
    .post::after { content: ""; position: absolute; right: -180px; top: -120px; width: 480px; height: 480px; border: 2px solid rgba(201,169,110,.25); border-radius: 50%; }
    .post::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,22,42,.12) 0%, rgba(11,22,42,.42) 62%, rgba(11,22,42,.82) 100%); pointer-events: none; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; min-height: 60px; position: relative; z-index: 1; }
    .brand { color: var(--accent, #C9A96E); font-size: 22px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
    .logo { max-width: 160px; max-height: 56px; object-fit: contain; display: none; filter: brightness(0) invert(1); }
    .content { min-height: 0; display: flex; flex: 1; flex-direction: column; justify-content: center; padding: var(--space-xl, 64px) 0 var(--space-xxl, 72px); position: relative; z-index: 1; }
    .kicker { margin: 0 0 var(--space-lg, 28px); color: var(--accent, #C9A96E); font-size: 24px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; position: relative; z-index: 1; }
    .kicker[data-empty="true"] { display: none; }
    h1 { margin: 0; font-family: var(--font-heading, Georgia), 'Times New Roman', serif; font-size: 76px; line-height: 1.04; max-width: 920px; font-weight: 700; position: relative; z-index: 1; }
    .highlight { margin-top: var(--space-xxl, 48px); padding: var(--space-lg, 28px) var(--space-xl, 36px); background: var(--accent, #C9A96E); color: var(--text-on-light, #1B2A4A); font-size: 30px; font-weight: 800; line-height: 1.22; max-width: 760px; position: relative; z-index: 1; }
    .highlight[data-empty="true"] { display: none; }
    .supporting { margin-top: var(--space-xl, 38px); font-size: 28px; line-height: 1.38; max-width: 820px; color: rgba(248,245,240,.78); position: relative; z-index: 1; }
    .supporting[data-empty="true"] { display: none; }
    .cta { margin-top: auto; padding-top: var(--space-lg, 32px); border-top: 4px solid var(--accent, #C9A96E); font-size: 26px; font-weight: 800; color: var(--accent, #C9A96E); text-transform: uppercase; letter-spacing: 1.4px; position: relative; z-index: 1; }
    .cta[data-empty="true"] { display: none; }
    .shape { position: absolute; z-index: 1; opacity: var(--shape-opacity, 0.55); pointer-events: none; }
    .shape.line { height: 2px; width: 86px; background: var(--accent, #C9A96E); }
    .shape.circle { width: 86px; height: 86px; border-radius: 50%; border: 1px solid rgba(201,169,110,.55); }
    .shape.triangle { width: 0; height: 0; border-left: 38px solid transparent; border-right: 38px solid transparent; border-bottom: 38px solid var(--accent, #C9A96E); }
    .shape[data-placement="top"] { top: 32px; left: 50%; transform: translateX(-50%); }
    .shape[data-placement="bottom"] { bottom: 32px; left: 50%; transform: translateX(-50%); }
    .shape[data-placement="left"] { left: 32px; top: 50%; transform: translateY(-50%); }
    .shape[data-placement="right"] { right: 32px; top: 50%; transform: translateY(-50%); }
    .shape[data-placement="tl"] { top: 32px; left: 32px; }
    .shape[data-placement="tr"] { top: 32px; right: 32px; }
    .shape[data-placement="bl"] { bottom: 32px; left: 32px; }
    .shape[data-placement="br"] { bottom: 32px; right: 32px; }
  </style>
</head>
<body>
  <main class="post">
    <div id="overlay-shapes"></div>
    <div class="top"><div id="brand_name" class="brand"></div><img id="logo" class="logo" /></div>
    <section class="content">
      <div id="kicker" class="kicker"></div>
      <h1 id="headline"></h1>
      <div id="highlight" class="highlight"></div>
      <p id="supporting" class="supporting"></p>
    </section>
    <div id="cta" class="cta"></div>
  </main>
  <script>
    document.addEventListener('renderdata', function () {
      var d = window.__DATA__ || {};
      var f = d.fields || {};
      var a = d.assets || {};
      var deco = d.decorators || {};
      document.getElementById('brand_name').textContent = f.brand_name || '';
      var kicker = document.getElementById('kicker');
      if (f.kicker) kicker.textContent = f.kicker; else kicker.setAttribute('data-empty', 'true');
      document.getElementById('headline').textContent = f.headline || '';
      var hl = document.getElementById('highlight');
      if (f.highlight) hl.textContent = f.highlight; else hl.setAttribute('data-empty', 'true');
      var sup = document.getElementById('supporting');
      if (f.supporting) sup.textContent = f.supporting; else sup.setAttribute('data-empty', 'true');
      var cta = document.getElementById('cta');
      if (f.cta) cta.textContent = f.cta; else cta.setAttribute('data-empty', 'true');
      if (a.logo) { var logo = document.getElementById('logo'); logo.src = 'data:image/png;base64,' + a.logo; logo.style.display = 'block'; }
      if (deco.shape_accents && deco.shape_accents.length) {
        var host = document.getElementById('overlay-shapes');
        deco.shape_accents.forEach(function (shape) {
          var el = document.createElement('div');
          el.className = 'shape ' + shape.type;
          el.setAttribute('data-placement', shape.placement);
          host.appendChild(el);
        });
      }
      if (deco.divider_type === 'accent') {
        var divider = document.createElement('div');
        divider.style.position = 'absolute';
        divider.style.left = '92px';
        divider.style.top = '290px';
        divider.style.width = '120px';
        divider.style.height = '2px';
        divider.style.background = 'var(--accent, #C9A96E)';
        divider.style.zIndex = '1';
        document.querySelector('.post').appendChild(divider);
      }
    });
  </script>
</body>
</html>
