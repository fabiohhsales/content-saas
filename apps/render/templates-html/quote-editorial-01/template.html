<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body { width: 1080px; height: 1350px; margin: 0; overflow: hidden; background: var(--bg-light, #F8F5F0); color: var(--text-on-light, #1B2A4A); font-family: var(--font-body, Arial), Helvetica, sans-serif; }
    .post { width: 1080px; height: 1350px; padding: 110px 96px 96px; display: flex; flex-direction: column; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; }
    .brand { color: var(--text-on-light, #1B2A4A); font-size: 22px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; opacity: .55; }
    .logo { max-width: 160px; max-height: 56px; object-fit: contain; display: none; }
    .quote-mark { font-family: Georgia, 'Times New Roman', serif; color: var(--accent, #C9A96E); font-size: 200px; line-height: .55; margin-top: 60px; }
    h1 { margin: 16px 0 0; font-family: var(--font-heading, Georgia), 'Times New Roman', serif; font-style: italic; font-size: 68px; line-height: 1.12; max-width: 880px; font-weight: 400; }
    h1 span { color: var(--accent, #C9A96E); font-weight: 700; }
    .autor { margin-top: 56px; font-size: 26px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--text-on-light, #1B2A4A); }
    .autor[data-empty="true"] { display: none; }
    .sub { margin-top: 22px; font-size: 26px; line-height: 1.4; max-width: 800px; color: rgba(27,42,74,.7); }
    .sub[data-empty="true"] { display: none; }
    .rule { margin-top: auto; width: 220px; height: 4px; background: var(--accent, #C9A96E); }
  </style>
</head>
<body>
  <main class="post">
    <div class="top"><div id="brand_name" class="brand"></div><img id="logo" class="logo" /></div>
    <div class="quote-mark">"</div>
    <h1 id="quote"></h1>
    <div id="autor" class="autor"></div>
    <div id="sub" class="sub"></div>
    <div class="rule"></div>
  </main>
  <script>
    document.addEventListener('renderdata', function () {
      var d = window.__DATA__ || {};
      var f = d.fields || {};
      var a = d.assets || {};
      document.getElementById('brand_name').textContent = f.brand_name || '';
      var quote = f.quote || '';
      var quoteEl = document.getElementById('quote');
      if (f.destaque && quote.indexOf(f.destaque) >= 0) {
        quoteEl.textContent = '';
        var i = quote.indexOf(f.destaque);
        quoteEl.appendChild(document.createTextNode(quote.slice(0, i)));
        var span = document.createElement('span');
        span.textContent = f.destaque;
        quoteEl.appendChild(span);
        quoteEl.appendChild(document.createTextNode(quote.slice(i + f.destaque.length)));
      } else {
        quoteEl.textContent = quote;
      }
      var autor = document.getElementById('autor');
      if (f.autor) autor.textContent = f.autor; else autor.setAttribute('data-empty', 'true');
      var sub = document.getElementById('sub');
      if (f.sub) sub.textContent = f.sub; else sub.setAttribute('data-empty', 'true');
      if (a.logo) { var logo = document.getElementById('logo'); logo.src = 'data:image/png;base64,' + a.logo; logo.style.display = 'block'; }
    });
  </script>
</body>
</html>
